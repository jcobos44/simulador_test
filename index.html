<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InduMaker - Simulador de Metrología</title>
    <style>
        :root {
            --primary-color: #2c3e50; /* Tono oscuro profesional */
            --secondary-color: #e67e22; /* Naranja vibrante para el FabLab */
            --bg-gradient-start: #3494E6; /* Azul vibrante */
            --bg-gradient-end: #EC6EAD; /* Tonos cálidos */
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            /* Fondo degradado alegre y moderno */
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            overflow: hidden;
            position: relative;
        }

        /* Íconos flotantes de fondo para simular el entorno FabLAB */
        .bg-icons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-icons span {
            position: absolute;
            font-size: 3.5rem;
            opacity: 0.15; /* Sutil como marca de agua */
            filter: grayscale(100%) brightness(200%); /* Efecto de agua sobre el degradado */
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Tarjeta principal */
        .container {
            position: relative;
            z-index: 1;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 45px 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 550px;
            width: 90%;
            border-top: 6px solid var(--secondary-color);
            backdrop-filter: blur(10px);
        }

        /* Marca / Nombre del espacio de trabajo */
        .brand {
            font-size: 16px;
            font-weight: 900;
            color: var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            color: var(--primary-color);
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            font-size: 17px;
            color: #555;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--secondary-color);
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 35px;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
        }

        .btn-link:hover {
            background-color: #d35400;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(230, 126, 34, 0.5);
        }

        .btn-link:active {
            transform: translateY(1px);
        }
        
        .icon {
            margin-right: 10px;
            font-size: 22px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- Fondo con íconos de FabLAB -->
    <div class="bg-icons">
        <span style="top: 15%; left: 10%; animation-delay: 0s;">⚙️</span>
        <span style="top: 25%; left: 85%; animation-delay: 1s;">📏</span>
        <span style="top: 70%; left: 15%; animation-delay: 2s;">📐</span>
        <span style="top: 80%; left: 80%; animation-delay: 0.5s;">🔧</span>
        <span style="top: 45%; left: 90%; animation-delay: 1.5s;">🖨️</span>
        <span style="top: 50%; left: 5%; animation-delay: 2.5s;">💻</span>
        <span style="top: 10%; left: 50%; animation-delay: 1.2s;">🧭</span>
        <span style="top: 90%; left: 45%; animation-delay: 0.8s;">🔨</span>
    </div>

    <div class="container">
        <!-- Nombre del espacio de trabajo -->
        <span class="brand">InduMaker</span>
        
        <h1>Bienvenido</h1>
        <p>Accede a nuestro entorno interactivo de aprendizaje. Desarrolla tus habilidades prácticas con nuestro simulador de Metrología Dimensional.</p>
        
        <a href="simulador-metrologia.html" class="btn-link">
            <span class="icon">🚀</span>Link Simulador. Clic Aquí
        </a>
    </div>

</body>
</html>
